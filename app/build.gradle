plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}
//apply plugin: 'realm-android'
apply plugin: 'com.android.application'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'androidx.navigation.safeargs'

android {
    namespace 'com.example.qurannexus'
    compileSdk 34
    flavorDimensions += "environment"
    defaultConfig {
        applicationId "com.example.qurannexus"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AWS_ACCESS_KEY", "\"${project.properties['AWS_ACCESS_KEY']}\""
        buildConfigField "String", "AWS_SECRET_KEY", "\"${project.properties['AWS_SECRET_KEY']}\""
    }

    buildTypes {
        debug{
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //  Define the actual product flavors
    // Define the actual product flavors
    productFlavors {
        // Flavor for connecting via the Android Emulator
        create("localEmulator") {
            dimension = "environment"
            // The emulator's special IP for the host machine's localhost
            buildConfigField("String", "BASE_URL", "\"http://10.0.2.2:8000/api/v1/mobile/\"")
        }

        // Flavor for connecting from a physical device on the same Wi-Fi
        create("localDevice") {
            dimension = "environment"
            // IMPORTANT: Replace with your computer's actual Wi-Fi IP address
            buildConfigField("String", "BASE_URL", "\"http://192.168.0.27:8000/api/v1/mobile/\"")
        }

        // Flavor for connecting to the production server
        create("prod") {
            dimension = "environment"
            buildConfigField("String", "BASE_URL", "\"http://13.238.101.42/api/v1/mobile/\"")
        }
    }
    buildFeatures{
        buildConfig true
    }
    dataBinding {
        enable true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
kapt {
    correctErrorTypes true
}
//realm {
//    syncEnabled = true
//}
dependencies {
    implementation(libs.multidex)
    // Hilt dependencies
    implementation libs.hilt.android
    implementation libs.swiperefreshlayout
    // ROOM DEPENDENCIES:
    // KEEP this for Android runtime
    implementation libs.room.runtime.android  // This is 'androidx.room:room-runtime'
    // KEEP this for Room Kotlin Extensions and coroutines support
    implementation "androidx.room:room-ktx:2.6.1" // Use the latest stable version
    // ADD KAPT for Room compiler
    kapt "androidx.room:room-compiler:2.6.1" // Use the same version as room-ktx and room-runtime

    // REMOVE these:
    // implementation libs.room.common.jvm // Not usually needed directly for app dev
    // implementation libs.room.runtime.jvm // THIS IS THE CULPRIT for duplicate classes

    kapt libs.hilt.compiler
    implementation 'androidx.hilt:hilt-navigation-fragment:1.2.0' // Consider updating if a newer stable version exists
    kapt "androidx.hilt:hilt-compiler:1.2.0" // This is for AndroidX Hilt, ensure it matches hilt-android version if possible

    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7" // Updated to latest stable (check for yours)
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"     // Updated to latest stable

    //graph dependencies
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation libs.rajawali
    //audio dependencies
    implementation 'com.amazonaws:aws-android-sdk-s3:2.72.0'
    implementation 'com.amazonaws:aws-android-sdk-mobile-client:2.72.0'
    def media3_version = "1.3.1" // Updated to a more recent stable version
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3" // Updated
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0" // Updated

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0' // Updated
    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // Or 2.11.0 if available and compatible
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' // Or 2.11.0
    implementation(name: 'meow-bottom-navigation-java-1.2.0', ext: 'aar')
    implementation 'com.tbuonomo:dotsindicator:5.0' // Updated
    implementation 'com.github.bumptech.glide:glide:4.16.0' // Updated
    kapt 'com.github.bumptech.glide:compiler:4.16.0' // Updated (use kapt instead of annotationProcessor for Kotlin)
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation libs.cardview
    implementation libs.kotlin.stdlib // This might be redundant if using kotlin-bom or already included
    implementation libs.appcompat
    implementation libs.activity
    implementation 'com.google.android.material:material:1.12.0' // Updated
    // implementation libs.material.v1120alpha02 // This is older than 1.12.0, remove or align
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.core.ktx
    implementation libs.room.runtime.android
    implementation libs.room.ktx
    kapt libs.room.compiler
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}